<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Recanto Guadalupe · Tour 360</title>
<style>
  /* Tour imersivo em tela cheia: um único visual escuro, deliberado */
  :root{--bg:#141110;--fg:#ffffff;--panel:rgba(20,16,12,.58);--panel-strong:rgba(20,16,12,.74);--accent:#8b623e;--accent-ink:#6b4a2e;--line:rgba(255,255,255,.22);color-scheme:dark}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab}
  #stage.drag{cursor:grabbing}
  #fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s ease}
  #title{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:calc(20px + env(safe-area-inset-left,0px));padding:10px 16px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:12px;pointer-events:none}
  #title h1{font-size:16px;font-weight:600;margin:0}
  #title p{font-size:12.5px;opacity:.85;margin:2px 0 0}
  #title .tag{display:inline-block;margin-top:6px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;padding:2px 8px;border:1px solid var(--line);border-radius:20px;opacity:.85}
  #rooms{position:fixed;max-height:calc(100vh - 120px);overflow-y:auto;top:calc(18px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
  #rooms button,#bar button{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left;transition:background .2s}
  #rooms button:hover,#bar button:hover{background:rgba(120,86,56,.75)}
  #rooms button:focus-visible,#bar button:focus-visible,.hs .dot:focus-visible{outline:2px solid #fff;outline-offset:2px}
  #rooms button.on,#bar button.on{background:var(--accent)}
  #bar{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px}
  #hint{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:13px;background:var(--panel-strong);padding:8px 14px;border-radius:20px;white-space:nowrap;pointer-events:none;transition:opacity 1s}
  .hs{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none}
  .hs .dot{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;transition:transform .2s;border:0}
  .hs .dot:hover{transform:scale(1.1)}
  .hs .dot::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,255,255,.85);animation:pulse 1.8s ease-out infinite}
  .hs .dot svg{width:24px;height:24px}
  .hs .lbl{position:absolute;left:34px;top:-15px;white-space:nowrap;font-size:13px;font-weight:500;background:var(--panel-strong);padding:6px 11px;border-radius:8px;pointer-events:none}
  @keyframes pulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.45);opacity:0}}
  @media (prefers-reduced-motion:reduce){.hs .dot::before{animation:none}}
  .ic{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none}
  .ic button{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(139,98,62,.88);box-shadow:0 2px 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;transition:transform .2s;padding:0}
  .ic button:hover{transform:scale(1.1)}
  .ic button:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .ic svg{width:22px;height:22px}
  .ic .lbl{position:absolute;left:30px;top:-14px;white-space:nowrap;font-size:12.5px;font-weight:500;background:var(--panel-strong);padding:5px 10px;border-radius:8px;pointer-events:none;display:flex;align-items:center;gap:6px}
  .ic .sw{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,.7)}
  #tvcredit{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:11px;background:var(--panel-strong);padding:5px 9px;border-radius:7px;opacity:.85;pointer-events:none}
  .ic .mute{position:absolute;left:-74px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(139,98,62,.88);box-shadow:0 2px 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;padding:0}
  .ic .mute svg{width:22px;height:22px}
  .ic .mute:hover{transform:scale(1.1)}
  .ic .mute:focus-visible{outline:2px solid #fff;outline-offset:3px}
  #luzbtn{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;z-index:6;background:none;border:0;padding:0;cursor:pointer;color:#fff;font:inherit}
  #luzbtn .lb{font-size:12.5px;font-weight:500;background:var(--panel-strong);padding:6px 11px;border-radius:8px}
  #luzbtn .rd{width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(139,98,62,.92);box-shadow:0 2px 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;transition:transform .2s,background .3s}
  #luzbtn:hover .rd{transform:scale(1.08)}
  #luzbtn.off .rd{background:rgba(40,40,44,.92)}
  #luzbtn:focus-visible .rd{outline:2px solid #fff;outline-offset:3px}
  #luzbtn svg{width:24px;height:24px}
  #luzbtn[hidden]{display:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:14px;letter-spacing:.4px;transition:opacity .6s}
  @media (max-width:900px), (hover:none) and (pointer:coarse){
    #title,#rooms,#bar{display:none}
    #hint{bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:12.5px}
  }
</style>
</head>

    camera.fov = view.fov; camera.updateProjectionMatrix();
    camera.lookAt(dirFor(view.lon, view.lat).multiplyScalar(500));
    renderer.render(scene, camera); placeHotspots(); placeIcons();
  }
  getTex("VarandaFrente1", function(){
    setRoom("VarandaFrente1", ROOMS.VarandaFrente1.start);
    var ld = document.getElementById("loading"); ld.style.opacity = 0; setTimeout(function(){ ld.remove(); }, 700);
    loop();
  });
})();
</script>
